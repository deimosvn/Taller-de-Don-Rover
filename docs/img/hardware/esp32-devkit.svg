<line x1="32" y1="686" x2="1068" y2="686" stroke="#E7D9CB" stroke-width="2"/>
<text x="40" y="712" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4E342E">• Alimenta la pantalla con 3V3 (no con VIN/5 V). Cables cortos: menos de 20 cm.</text>
<text x="40" y="734" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4E342E">• El botón BOOT de la placa (GPIO0) es el botón de Don Rover. No lo mantengas presionado al conectar el cable.</text>
<text x="40" y="756" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#4E342E">• Sin PSRAM la cara usa 256 colores; con Wi-Fi y nube a la vez la memoria queda justa.</text>
