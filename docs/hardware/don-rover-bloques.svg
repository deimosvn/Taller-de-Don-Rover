<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A120D"/></marker></defs><rect width="1300" height="640" fill="#FFFBF6"/><text x="650" y="46" font-size="30" text-anchor="middle" font-weight="700" fill="#2A120D">Don Rover · cómo se conecta todo</text><text x="650" y="76" font-size="16" text-anchor="middle" font-weight="400" fill="#7A5A4E">Un ESP32 (programado con Arduino) controla la pantalla, escucha con el micrófono y habla por la bocina. Una batería lo hace portátil.</text><rect x="40" y="140" width="220" height="90" rx="16" fill="#FFF1F1" stroke="#D7263D" stroke-width="3"/><text x="150.0" y="181.0" font-size="19" text-anchor="middle" font-weight="700" fill="#2A120D">Batería LiPo</text><text x="150.0" y="205.0" font-size="14" text-anchor="middle" font-weight="400" fill="#7A5A4E">3.7 V · 1000–2000 mAh</text><rect x="40" y="275" width="220" height="90" rx="16" fill="#FFF1F1" stroke="#D7263D" stroke-width="3"/><text x="150.0" y="316.0" font-size="19" text-anchor="middle" font-weight="700" fill="#2A120D">Cargador TP4056</text><text x="150.0" y="340.0" font-size="14" text-anchor="middle" font-weight="400" fill="#7A5A4E">carga por USB-C</text><rect x="40" y="410" width="220" height="90" rx="16" fill="#FFF1F1" stroke="#D7263D" stroke-width="3"/><text x="150.0" y="451.0" font-size="19" text-anchor="middle" font-weight="700" fill="#2A120D">Elevador a 5 V</text><text x="150.0" y="475.0" font-size="14" text-anchor="middle" font-weight="400" fill="#7A5A4E">MT3608 · 5.1 V</text><line x1="150" y1="230" x2="150" y2="272" stroke="#D7263D" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><line x1="150" y1="365" x2="150" y2="407" stroke="#D7263D" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><text x="225" y="392" f