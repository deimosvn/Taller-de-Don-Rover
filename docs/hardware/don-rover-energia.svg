<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="640" viewBox="0 0 1380 640" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A120D"/></marker></defs><rect width="1380" height="640" fill="#FFFBF6"/><text x="690" y="42" font-size="28" text-anchor="middle" font-weight="700" fill="#2A120D">Don Rover · energía con batería (portátil)</text><text x="690" y="70" font-size="16" text-anchor="middle" font-weight="400" fill="#7A5A4E">Batería LiPo de 1 celda → cargador TP4056 → interruptor → elevador a 5 V → diodo → pin 5V del ESP32 y amplificador.</text><rect x="50" y="285" width="110" height="130" rx="12" fill="#FFF1F1" stroke="#D7263D" stroke-width="3"/><text x="105" y="330" font-size="18" text-anchor="middle" font-weight="700" fill="#2A120D">LiPo</text><text x="105" y="352" font-size="14" text-anchor="middle" font-weight="400" fill="#7A5A4E">3.7 V · 1S</text><text x="105" y="372" font-size="13" text-anchor="middle" font-weight="400" fill="#7A5A4E">1000–2000 mAh</text><text x="105" y="396" font-size="12" text-anchor="middle" font-weight="400" fill="#7A5A4E">con protección</text><text x="88" y="276" font-size="20" text-anchor="middle" font-weight="700" fill="#D7263D">+</text><text x="88" y="436" font-size="20" text-anchor="middle" font-weight="700" fill="#222222">−</text><polyline points="105,285 105,250 240,250" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="105,415 105,430 240,430" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="150" width="200" height="320" rx="14" fill="#FFFFFF" stroke="#D7263D" stroke-width="3"/><rect x="300" y="116" width="80" height="34" rx="6" fill="#C9CED6" stroke="#8892A3" stroke-width="2"/><text x="340" y="138" font-size="13" text-anchor="middle" font-weight="700" fill="#2A120D">USB-C</text><text x="340" y="106" font-size="13" text-anchor="middle" font-weight="400" fill="#7A5A4E">cargar con 5 V</text><text x="340" y="184" font-size="16" text-anchor="middle" font-weight="700" fill="#2A120D">Cargador TP4056</text><text x="340" y="204" font-size="12" text-anchor="middle" font-weight="400" fill="#7A5A4E">con protección DW01</text><text x="254" y="255" font-size="14" text-anchor="start" font-weight="700" fill="#2A120D">B+</text><text x="254" y="435" font-size="14" text-anchor="start" font-weight="700" fill="#2A120D">B−</text><text x="426" y="255" font-size="14" text-anchor="end" font-weight="700" fill="#2A120D">OUT+</text><text x="426" y="435" font-size="14" text-anchor="end" font-weight="700" fill="#2A120D">OUT−</text><polyline points="440,430 470,430 470,500" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="440,250 480,250" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="484" cy="250" r="5" fill="#D7263D"/><circle cx="536" cy="250" r="5" fill="#D7263D"/><polyline points="484,250 530,228" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="216" font-size="14" text-anchor="middle" font-weight="700" fill="#2A120D">Interruptor</text><polyline points="536,250 780,250" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="612" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#D7263D">VBAT</text><circle cx="600" cy="250" r="5" fill="#D7263D"/><polyline points="600,250 600,284" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,284 l-10,6 l20,10 l-20,10 l20,10 l-20,10 l20,10 l-10,6" fill="none" stroke="#0F8B8D" stroke-width="3"/><text x="582" y="320" font-size="13" text-anchor="end" font-weight="700" fill="#0F8B8D">R1 100 kΩ</text><polyline points="600,346 600,362" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="362" r="5" fill="#0F8B8D"/><polyline points="600,362 600,378" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,378 l-10,6 l20,10 l-20,10 l20,10 l-20,10 l20,10 l-10,6" fill="none" stroke="#0F8B8D" stroke-width="3"/><text x="582" y="414" font-size="13" text-anchor="end" font-weight="700" fill="#0F8B8D">R2 100 kΩ</text><polyline points="600,440 600,500" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="600,362 670,362 670,404" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="655,404 685,404" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="655,414 685,414" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="670,414 670,500" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="692" y="414" font-size="12" text-anchor="start" font-weight="700" fill="#0F8B8D">100 nF</text><polyline points="600,362 586,362" fill="none" stroke="#0F8B8D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="458" y="349" width="128" height="26" rx="13" fill="#0F8B8D" stroke="none" stroke-width="2"/><text x="522.0" y="368" font-size="15" text-anchor="middle" font-weight="700" fill="#FFFFFF">BAT → GPIO34</text><rect x="780" y="150" width="200" height="320" rx="14" fill="#FFFFFF" stroke="#D7263D" stroke-width="3"/><text x="880" y="184" font-size="16" text-anchor="middle" font-weight="700" fill="#2A120D">Elevador MT3608</text><text x="880" y="204" font-size="12" text-anchor="middle" font-weight="400" fill="#7A5A4E">ajústalo a 5.1 V</text><text x="794" y="255" font-size="14" text-anchor="start" font-weight="700" fill="#2A120D">IN+</text><text x="794" y="435" font-size="14" text-anchor="start" font-weight="700" fill="#2A120D">IN−</text><text x="966" y="255" font-size="14" text-anchor="end" font-weight="700" fill="#2A120D">OUT+</text><text x="966" y="435" font-size="14" text-anchor="end" font-weight="700" fill="#2A120D">OUT−</text><text x="880" y="330" font-size="12" text-anchor="middle" font-weight="400" fill="#7A5A4E">o un módulo fijo</text><text x="880" y="348" font-size="12" text-anchor="middle" font-weight="400" fill="#7A5A4E">de 5 V y 1 A o más</text><polyline points="780,430 760,430 760,500" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="980,430 1000,430 1000,500" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="980,250 1030,250" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1030,234 L1030,266 L1060,250 Z" fill="#D7263D"/><line x1="1062" y1="234" x2="1062" y2="266" stroke="#D7263D" stroke-width="4"/><text x="1046" y="224" font-size="13" text-anchor="middle" font-weight="700" fill="#2A120D">Diodo SS14</text><text x="1046" y="290" font-size="11" text-anchor="middle" font-weight="400" fill="#7A5A4E">evita que el USB</text><text x="1046" y="304" font-size="11" text-anchor="middle" font-weight="400" fill="#7A5A4E">alimente al elevador</text><polyline points="1062,250 1340,250" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1170" y="240" font-size="15" text-anchor="middle" font-weight="700" fill="#D7263D">+5 V</text><polyline points="1130,250 1130,370" fill="none" stroke="#D7263D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1114,370 1146,370" fill="none" stroke="#D7263D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1114,384 Q1130,374 1146,384" fill="none" stroke="#D7263D" stroke-width="4"/><polyline points="1130,380 1130,500" fill="none" stroke="#D7263D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1108" y="384" font-size="12" text-anchor="end" font-weight="700" fill="#D7263D">470 µF</text><rect x="1170" y="290" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#D7263D" stroke-width="2"/><text x="1245" y="316" font-size="14" text-anchor="middle" font-weight="700" fill="#2A120D">ESP32 · pin 5V</text><text x="1245" y="336" font-size="12" text-anchor="middle" font-weight="400" fill="#7A5A4E">(VIN)</text><rect x="1170" y="380" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#D7263D" stroke-width="2"/><text x="1245" y="406" font-size="14" text-anchor="middle" font-weight="700" fill="#2A120D">MAX98357A</text><text x="1245" y="426" font-size="12" text-anchor="middle" font-weight="400" fill="#7A5A4E">VIN</text><polyline points="1245,250 1245,290" fill="none" stroke="#D7263D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1340,250 1340,412 1320,412" fill="none" stroke="#D7263D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="105,430 105,500 1300,500" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="528" font-size="14" text-anchor="middle" font-weight="700" fill="#222222">GND común: batería, cargador, elevador, ESP32, pantalla, micrófono y amplificador</text><text x="50" y="572" font-size="14" text-anchor="start" font-weight="400" fill="#2A120D">• Carga la batería por el USB-C del TP4056. Con el interruptor apagado, el robot no gasta batería.</text><text x="50" y="594" font-size="14" text-anchor="start" font-weight="400" fill="#2A120D">• Ajusta el MT3608 a 5.1 V con un multímetro ANTES de conectar el ESP32. Usa batería LiPo con protección; nunca la perfores ni la cargues sin vigilancia.</text><text x="50" y="616" font-size="14" text-anchor="start" font-weight="400" fill="#2A120D">• El divisor deja la mitad del voltaje de la batería en GPIO34: 4.2 V (llena) → 2.1 V · 3.3 V (vacía) → 1.65 V.</text></svg>
