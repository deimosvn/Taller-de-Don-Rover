<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A120D"/></marker></defs><rect width="1100" height="680" fill="#FFFBF6"/><text x="550" y="44" font-size="28" text-anchor="middle" font-weight="700" fill="#2A120D">Don Rover · cómo queda armado</text><text x="550" y="72" font-size="16" text-anchor="middle" font-weight="400" fill="#7A5A4E">Ilustración: la cabeza lleva la pantalla redonda; el cuerpo guarda el ESP32, la batería, el micrófono y la bocina.</text><rect x="324" y="104" width="12" height="46" rx="6" fill="#C9D3E3" stroke="none" stroke-width="2"/><circle cx="330" cy="102" r="16" fill="#FF9F6B" stroke="#F07A45" stroke-width="3"/><circle cx="330" cy="270" r="122" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="6"/><rect x="180" y="236" width="34" height="70" rx="16" fill="#FF9F6B" stroke="none" stroke-width="2"/><rect x="446" y="236" width="34" height="70" rx="16" fill="#FF9F6B" stroke="none" stroke-width="2"/><circle cx="330" cy="272" r="88" fill="#DCEBFC" stroke="#9FB4D3" stroke-width="3"/><ellipse cx="300.96" cy="264.96" rx="10.559999999999999" ry="14.08" fill="#2B3A67"/><circle cx="297.44" cy="258.8" r="4.4" fill="#FFFFFF"/><ellipse cx="359.04" cy="264.96" rx="10.559999999999999" ry="14.08" fill="#2B3A67"/><circle cx="355.52000000000004" cy="258.8" r="4.4" fill="#FFFFFF"/><ellipse cx="281.6" cy="294.0" rx="10.559999999999999" ry="6.16" fill="#FF9FB2" opacity="0.7"/><ellipse cx="378.4" cy="294.0" rx="10.559999999999999" ry="6.16" fill="#FF9FB2" opacity="0.7"/><path d="M312.4,298.4 Q330,316.0 347.6,298.4" fill="none" stroke="#2B3A67" stroke-width="5.279999999999999" stroke-linecap="round"/><rect x="290" y="388" width="80" height="26" rx="8" fill="#C9D3E3" stroke="none" stroke-width="2"/><rect x="180" y="412" width="300" height="200" rx="34" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="6"/><rect x="230" y="470" width="120" height="6" rx="3" fill="#C9D3E3" stroke="none" stroke-width="2"/><rect x="230" y="484" width="120" height="6" rx="3" fill="#C9D3E3" stroke="none" stroke-width="2"/><rect x="230" y="498" width="120" height="6" rx="3" fill="#C9D3E3" stroke="none" stroke-width="2"/><rect x="230" y="512" width="120" height="6" rx="3" fill="#C9D3E3" stroke="none" stroke-width="2"/><rect x="230" y="526" width="120" height="6" rx="3" fill="#C9D3E3" stroke="none" stroke-width="2"/><circle cx="410" cy="490" r="9" fill="#2B3A67"/><rect x="370" y="560" width="70" height="24" rx="6" fill="#C9CED6" stroke="#8892A3" stroke-width="2"/><circle cx="220" cy="580" r="10" fill="#3FCB6A"/><polyline points="346,100 600,110 640,110" fill="none" stroke="#8A6253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="346" cy="100" r="5" fill="#8A6253"/><text x="648" y="108" font-size="17" text-anchor="start" font-weight="700" fill="#2A120D">Botón (antena)</text><text x="648" y="128" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">GPIO0 · corto repite, largo pregunta</text><polyline points="390,250 600,200 640,200" fill="none" stroke="#8A6253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="250" r="5" fill="#8A6253"/><text x="648" y="198" font-size="17" text-anchor="start" font-weight="700" fill="#2A120D">Pantalla redonda GC9A01</text><text x="648" y="218" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">la cara de Don Rover · SPI</text><polyline points="480,270 600,290 640,290" fill="none" stroke="#8A6253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="270" r="5" fill="#8A6253"/><text x="648" y="288" font-size="17" text-anchor="start" font-weight="700" fill="#2A120D">Orejas</text><text x="648" y="308" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">luces o decoración</text><polyline points="410,490 600,460 640,460" fill="none" stroke="#8A6253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="490" r="5" fill="#8A6253"/><text x="648" y="458" font-size="17" text-anchor="start" font-weight="700" fill="#2A120D">Micrófono INMP441</text><text x="648" y="478" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">un orificio de 3 mm frente al micrófono</text><polyline points="340,495 600,380 640,380" fill="none" stroke="#8A6253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="495" r="5" fill="#8A6253"/><text x="648" y="378" font-size="17" text-anchor="start" font-weight="700" fill="#2A120D">Bocina + MAX98357A</text><text x="648" y="398" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">rejilla para que salga el sonido</text><polyline points="405,572 600,540 640,540" fill="none" stroke="#8A6253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="405" cy="572" r="5" fill="#8A6253"/><text x="648" y="538" font-size="17" text-anchor="start" font-weight="700" fill="#2A120D">USB-C de carga</text><text x="648" y="558" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">TP4056 · solo carga la batería</text><polyline points="220,580 600,615 640,615" fill="none" stroke="#8A6253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="580" r="5" fill="#8A6253"/><text x="648" y="613" font-size="17" text-anchor="start" font-weight="700" fill="#2A120D">Interruptor de encendido</text><text x="648" y="633" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">apaga la batería</text><text x="60" y="660" font-size="14" text-anchor="start" font-weight="400" fill="#7A5A4E">Puedes imprimir la carcasa en 3D o usar una caja; deja huecos para la pantalla, el micrófono, la bocina, los dos USB (carga y programar) y el interruptor.</text></svg>
