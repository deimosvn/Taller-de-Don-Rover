; Firmware de Don Rover: la cara del asistente en una pantalla redonda GC9A01 de 240 × 240.
;
;   pio run -e knomi                 → compilar una placa
;   pio run -e knomi -t upload       → instalar por USB
;   pio run                          → compilar todas (y publicar las imágenes en public/firmware/)
;   pio device monitor               → ver los mensajes de la placa (115200)
;
; Placas (los diagramas de conexión están en el README principal, sección "Hardware"):
;   knomi            BIGTREETECH KNOMI v1 (ESP32-WROVER-E, pantalla integrada)         · sin cables
;   esp32c3-round    ESP32-2424S012 (ESP32-C3 + pantalla redonda táctil integrada)      · sin cables
;   esp32-devkit     ESP32 DevKit V1 (ESP32-WROOM-32) + módulo GC9A01                    · 7 cables
;   esp32c3-mini     ESP32-C3 SuperMini + módulo GC9A01                                  · 7 cables
;   esp32s3-n16r8    ESP32-S3 DevKitC N16R8 + módulo GC9A01                               · 7 cables

[platformio]
default_envs = knomi, esp32c3-round, esp32-devkit, esp32c3-mini, esp32s3-n16r8

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = post:merge_bin.py
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; ---- pantalla GC9A01 (TFT_eSPI) ----
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_READ_FREQUENCY=5000000
  ; Los paneles IPS GC9A01 necesitan la inversión de color encendida (se puede cambiar
  ; desde la plataforma si un módulo se ve con los colores al revés).
  -DDISPLAY_INVERT=1

; ---------------------------------------------------------------- KNOMI v1
[env:knomi]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
custom_board_name = BIGTREETECH KNOMI v1
build_flags =
  ${env.build_flags}
  -DBOARD_ID=\"knomi\"
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=19
  -DTFT_RST=4
  -DSPI_FREQUENCY=80000000
  -DPIN_BACKLIGHT=2
  ; La luz de fondo de la KNOMI es un chip AW9346: se regula con pulsos, no con PWM.
  -DBACKLIGHT_AW9346=1
  -DPIN_BUTTON=0

; ---------------------------------------------------------------- ESP32-2424S012
[env:esp32c3-round]
board = esp32-c3-devkitm-1
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
custom_board_name = ESP32-2424S012 (ESP32-C3 con pantalla redonda)
build_flags =
  ${env.build_flags}
  -DBOARD_ID=\"esp32c3-round\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTFT_MOSI=7
  -DTFT_SCLK=6
  -DTFT_CS=10
  -DTFT_DC=2
  -DTFT_RST=-1
  -DSPI_FREQUENCY=80000000
  -DPIN_BACKLIGHT=3
  -DPIN_BUTTON=9
  ; Pantalla táctil CST816S: un toque en la cara funciona como el botón de Don Rover.
  -DTOUCH_CST816S=1
  -DTOUCH_SDA=4
  -DTOUCH_SCL=5
  -DTOUCH_RST=1

; ---------------------------------------------------------------- ESP32 DevKit V1
[env:esp32-devkit]
board = esp32dev
board_build.partitions = huge_app.csv
custom_board_name = ESP32 DevKit V1 + módulo GC9A01
build_flags =
  ${env.build_flags}
  -DBOARD_ID=\"esp32-devkit\"
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=19
  -DTFT_RST=4
  -DSPI_FREQUENCY=40000000
  -DPIN_BACKLIGHT=22
  -DPIN_BUTTON=0

; ---------------------------------------------------------------- ESP32-C3 SuperMini
[env:esp32c3-mini]
board = esp32-c3-devkitm-1
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
custom_board_name = ESP32-C3 SuperMini + módulo GC9A01
build_flags =
  ${env.build_flags}
  -DBOARD_ID=\"esp32c3-mini\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTFT_MOSI=6
  -DTFT_SCLK=4
  -DTFT_CS=7
  -DTFT_DC=10
  -DTFT_RST=3
  -DSPI_FREQUENCY=40000000
  -DPIN_BACKLIGHT=5
  -DPIN_BUTTON=9

; ---------------------------------------------------------------- ESP32-S3 N16R8
[env:esp32s3-n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
custom_board_name = ESP32-S3 DevKitC N16R8 + módulo GC9A01
build_flags =
  ${env.build_flags}
  -DBOARD_ID=\"esp32s3-n16r8\"
  -DBOARD_HAS_PSRAM
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=14
  -DSPI_FREQUENCY=80000000
  -DPIN_BACKLIGHT=21
  -DPIN_BUTTON=0
