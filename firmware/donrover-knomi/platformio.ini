; Firmware de Don Rover para la placa BIGTREETECH KNOMI v1
; (ESP32-WROVER-E · 16 MB de flash · 8 MB de PSRAM · pantalla redonda GC9A01 de 240 × 240).
;
;   pio run                 → compilar
;   pio run -t upload       → instalar por USB
;   pio device monitor      → ver los mensajes de la placa
;
; Pines tomados del firmware oficial de KNOMI (src/pinout_knomi_v1.h, rama "firmware").

[env:knomi]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
extra_scripts = post:merge_bin.py
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
  ; ---- pantalla (TFT_eSPI) ----
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=19
  -DTFT_RST=4
  -DTFT_INVERSION_OFF=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=80000000
  -DSPI_READ_FREQUENCY=5000000
  ; ---- otros pines de la KNOMI v1 ----
  -DPIN_BACKLIGHT=2
  -DPIN_BUTTON=0
